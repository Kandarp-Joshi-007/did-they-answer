# Static publish only. The daily job runs in GitHub Actions and commits site/data.json;
# Netlify redeploys on that push. No build step, no functions.

[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
