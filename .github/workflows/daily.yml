name: daily

# Fetches the newest written Dáil answers, has Jev judge them, and commits the results.
# Netlify redeploys the site on that push. Committing (rather than a database) also keeps a
# dated public record of what was judged and when.

on:
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC daily; GitHub may start scheduled runs late
  workflow_dispatch:              # run by hand from the Actions tab

permissions:
  contents: write                 # to commit the results back

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only - nothing to install.
      - name: Fetch, judge, rebuild
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python daily.py

      # main can move while the job runs (a push from a laptop), so rebase and retry the push
      # rather than failing after the judging has already been paid for.
      - name: Commit results
        run: |
          git config user.name "did-they-answer bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/judgments.jsonl data/daily_asked.json data/recent.jsonl site/data.json
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Daily update $(date -u +%F)"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected; rebasing and retrying"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          exit 1
